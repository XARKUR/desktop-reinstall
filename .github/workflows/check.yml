name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests without installing software
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n install.sh && bash -n environment/install.sh && bash -n environment/install-docker-debian.sh
      - name: Read-only module preview
        run: |
          ./install.sh --list
          ./install.sh --only environment,lunar --skip docker
